name: Tralog Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: tralog_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        working-directory: ./tralog-server # 👈 중요: 최상위에서 백엔드 폴더로 진입하여 설치
        run: npm install

      - name: Run DB Connection Test
        env:
          PORT: 5001
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: tralog_db
          DB_PORT: 3306
        working-directory: ./tralog-server # 👈 중요: 백엔드 폴더로 진입하여 테스트 실행
        run: |
          node -e "
          const mysql = require('mysql2/promise');
          async function test() {
            try {
              const conn = await mysql.createConnection({
                host: '127.0.0.1', user: 'root', password: 'test_password', database: 'tralog_db'
              });
              console.log('GitHub Actions: DB Connection Success!');
              await conn.end();
              process.exit(0);
            } catch(e) {
              console.error(e);
              process.exit(1);
            }
          }
          test();
          "
