name: Tralog

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: ./Tralog
        run: npm install

      - name: Build
        working-directory: ./Tralog
        run: npm run build
        env:
          VITE_API_BASE_URL: https://tralog-gql3.onrender.com
          VITE_NAVER_MAP_CLIENT_ID: 9ffc0uiggv

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Tralog/dist

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
