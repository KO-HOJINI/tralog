name: Tralog

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: ./Tralog # 👈 중요: 프론트엔드 폴더로 이동해서 패키지 설치
        run: npm install

      - name: Build
        working-directory: ./Tralog # 👈 중요: 프론트엔드 폴더로 이동해서 빌드 실행
        run: npm run build
        env:
          # 프론트 번들에 포함되는 공개 클라이언트 값 (.env가 커밋되지 않으므로 여기서 주입)
          VITE_API_BASE_URL: https://tralog-gql3.onrender.com
          VITE_NAVER_MAP_CLIENT_ID: 9ffc0uiggv

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Tralog/dist # 👈 중요: 빌드된 결과물(dist)의 위치를 프론트엔드 폴더 내부로 지정

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
